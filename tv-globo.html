<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV ao vivo · Globo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1120;
      --panel: #161c31;
      --panel-2: #1e2540;
      --line: #2a3358;
      --text: #f2f4fb;
      --muted: #8e98bd;
      --accent: #ff8a3d;
      --accent-2: #3d7bff;
      --ok: #3ddc97;
      --err: #ff5d6c;
      --r: 20px;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 8% -10%, rgba(61, 123, 255, .28), transparent 60%),
        radial-gradient(800px 500px at 100% 0, rgba(255, 138, 61, .18), transparent 55%),
        var(--bg);
      background-attachment: fixed;
    }

    button,
    input {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: clamp(14px, 3vw, 32px);
      display: grid;
      gap: 22px;
      grid-template-columns: minmax(0, 1fr) 340px;
      align-items: start
    }

    header {
      grid-column: 1/-1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px
    }

    .brand {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 700;
      letter-spacing: -.02em
    }

    .brand span {
      color: var(--accent)
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 7px 14px;
      border-radius: 999px
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted)
    }

    .live[data-s="live"] .dot {
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(61, 220, 151, .18)
    }

    .live[data-s="load"] .dot {
      background: var(--accent);
      animation: pulse 1s infinite
    }

    .live[data-s="err"] .dot {
      background: var(--err)
    }

    @keyframes pulse {
      50% {
        opacity: .3
      }
    }

    .stage {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden
    }

    .screen {
      position: relative;
      aspect-ratio: 16/9;
      background: #000
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      text-align: center;
      padding: 24px;
      background: rgba(8, 10, 20, .82);
      backdrop-filter: blur(6px)
    }

    .overlay.show {
      display: grid
    }

    .overlay p {
      max-width: 36ch;
      color: var(--muted);
      line-height: 1.5
    }

    .overlay strong {
      display: block;
      color: var(--text);
      font-size: 1.15rem;
      margin-bottom: 6px
    }

    .info {
      padding: 18px 20px 20px;
      display: grid;
      gap: 14px
    }

    .title {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #fff;
      display: grid;
      place-items: center;
      flex: none;
      overflow: hidden;
      color: #0d1120;
      font-weight: 700
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px
    }

    .title h1 {
      font-size: clamp(1.2rem, 2.6vw, 1.6rem);
      letter-spacing: -.01em;
      line-height: 1.15
    }

    .title small {
      color: var(--muted);
      font-size: .9rem
    }

    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .sources span {
      color: var(--muted);
      align-self: center;
      font-size: .9rem;
      margin-right: 2px
    }

    .chip {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: .88rem;
      cursor: pointer;
      transition: background .15s, border-color .15s
    }

    .chip:hover {
      border-color: var(--accent-2)
    }

    .chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #1a0f05;
      font-weight: 600
    }

    aside {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      display: flex;
      flex-direction: column;
      max-height: min(78vh, 720px);
      min-height: 0
    }

    .tools {
      padding: 14px;
      display: grid;
      gap: 10px;
      border-bottom: 1px solid var(--line)
    }

    .tools input {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px
    }

    .tools input::placeholder {
      color: var(--muted)
    }

    .direct {
      display: flex;
      gap: 8px;
      margin-top: 8px
    }
    .direct input { flex: 1 }
    .direct button { flex: none }

    .tabs {
      display: flex;
      gap: 8px
    }

    .list {
      overflow-y: auto;
      padding: 8px;
      display: grid;
      gap: 4px;
      align-content: start;
      flex: 1
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 9px 10px;
      cursor: pointer;
      transition: background .15s
    }

    .item:hover {
      background: var(--panel-2)
    }

    .item[aria-current="true"] {
      background: var(--panel-2);
      border-color: var(--accent)
    }

    .item .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: .85rem
    }

    .item b {
      display: block;
      font-weight: 500;
      font-size: .98rem
    }

    .item small {
      color: var(--muted);
      font-size: .8rem
    }

    .empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      line-height: 1.5
    }

    @media (max-width:900px) {
      .app {
        grid-template-columns: minmax(0, 1fr)
      }

      aside {
        max-height: none
      }

      .list {
        max-height: 52vh
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">TV<span>.</span>ao vivo</div>
      <div class="live" id="status" data-s="load" role="status"><i class="dot"></i><span id="statusText">Carregando
          canais…</span></div>
    </header>

    <main class="stage">
      <div class="screen">
        <video id="video" controls playsinline autoplay></video>
        <div class="overlay" id="overlay">
          <div><strong id="ovTitle"></strong>
            <p id="ovText"></p>
            <button id="ovRetry" style="display:none;margin-top:10px;padding:8px 14px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;cursor:pointer">Tentar novamente</button>
          </div>
        </div>
      </div>
      <div class="info">
        <div class="title">
          <div class="logo" id="logo">TV</div>
          <div>
            <h1 id="name">Globo</h1><small id="meta">Buscando transmissão…</small>
          </div>
        </div>
        <div class="sources" id="sources"></div>
      </div>
    </main>

    <aside>
      <div class="tools">
        <input id="search" type="search" placeholder="Buscar canal" aria-label="Buscar canal">
        <div class="direct">
          <input id="directUrl" type="text" placeholder="Cole um link .m3u8 ou .mp4" aria-label="Link direto da stream">
          <button id="btnDirect">Assistir</button>
        </div>
        <div class="tabs">
          <button class="chip" id="tabGlobo" aria-pressed="true">Globo</button>
          <button class="chip" id="tabAll" aria-pressed="false">Todos do Brasil</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script>
    const API = 'https://iptv-org.github.io/api/';
    const $ = id => document.getElementById(id);
    const video = $('video');
    const S = {
      channels: [],
      streams: new Map(),
      onlyGlobo: true,
      q: '',
      current: null,
      idx: 0,
      hls: null,
      fallback: false
    };

    // Canais de teste com streams públicas conhecidas. Servem de fallback para
    // o player funcionar mesmo quando a API de canais não responde ou não
    // retorna nenhuma transmissão com sinal.
    const DEMO = [
      {
        id: 'demo-sintel',
        name: 'Sintel · teste de reprodução',
        network: 'Demo',
        categories: ['Teste'],
        streams: [
          { url: 'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8', quality: '720p' },
          { url: 'https://bitmovin-a.akamaihd.net/content/sintel/hls/playlist.m3u8', quality: '720p' }
        ]
      },
      {
        id: 'demo-bbb',
        name: 'Big Buck Bunny · teste de reprodução',
        network: 'Demo',
        categories: ['Teste'],
        streams: [
          { url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', quality: '1080p' },
          { url: 'https://stream.mux.com/x36xhzz.m3u8', quality: '1080p' }
        ]
      }
    ];

    function setStatus(state, text) {
      $('status').dataset.s = state;
      $('statusText').textContent = text;
    }
    function overlay(title, text, canRetry) {
      $('ovTitle').textContent = title || '';
      $('ovText').textContent = text || '';
      const show = !!title;
      $('overlay').classList.toggle('show', show);
      const btn = $('ovRetry');
      btn.style.display = canRetry && show ? 'inline-block' : 'none';
    }
    const initials = n => n.replace(/[^A-Za-zÀ-ú ]/g, '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'TV';

    function logoEl(c, el) {
      el.textContent = '';
      if (c.logo) {
        const img = new Image(); img.alt = ''; img.src = c.logo;
        img.onerror = () => { el.textContent = initials(c.name); };
        el.appendChild(img);
      } else el.textContent = initials(c.name);
    }

    async function load() {
      setStatus('load', 'Carregando canais…');
      overlay();
      let ok = false;
      try {
        const [channels, streams] = await Promise.all([
          fetch(API + 'channels.json').then(r => r.json()),
          fetch(API + 'streams.json').then(r => r.json())
        ]);
        const blockHttp = location.protocol === 'https:';
        for (const s of streams) {
          if (!s.channel || (blockHttp && s.url.startsWith('http:'))) continue;
          if (!S.streams.has(s.channel)) S.streams.set(s.channel, []);
          S.streams.get(s.channel).push(s);
        }
        for (const list of S.streams.values())
          list.sort((a, b) => (parseInt(b.quality) || 0) - (parseInt(a.quality) || 0));

        S.channels = channels
          .filter(c => c.country === 'BR' && !c.is_nsfw && !c.closed && S.streams.has(c.id))
          .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
        ok = S.channels.length > 0;
        S.fallback = !ok;
      } catch (e) {
        ok = false;
        S.fallback = true;
      }

      if (!ok) {
        S.channels = DEMO;
        setStatus('err', 'Canais de teste');
        overlay('Transmissões ao vivo indisponíveis',
          'A API de canais não respondeu ou não retornou sinal. Abaixo estão canais de teste para verificar se o player está funcionando.',
          true);
      }

      render();
      const first = S.channels.find(c => /globo/i.test(c.name) && !/news|play/i.test(c.name))
        || S.channels.find(c => /globo/i.test(c.name))
        || S.channels[0];
      if (first) select(first);
      else {
        setStatus('err', 'Sem sinal');
        overlay('Nenhum canal disponível', 'Não há canais para reproduzir agora. Tente novamente mais tarde.', true);
      }
    }

    function visible() {
      const q = S.q.trim().toLowerCase();
      return S.channels.filter(c =>
        (!S.onlyGlobo || /globo/i.test(c.name)) &&
        (!q || c.name.toLowerCase().includes(q)));
    }

    function render() {
      const box = $('list'); box.textContent = '';
      const items = visible();
      if (!items.length) {
        box.innerHTML = '<div class="empty">Nenhum canal encontrado.<br>Tente outro nome ou veja todos do Brasil.</div>';
        return;
      }
      for (const c of items) {
        const b = document.createElement('button');
        b.className = 'item';
        b.setAttribute('aria-current', S.current && S.current.id === c.id);
        const l = document.createElement('div'); l.className = 'logo'; logoEl(c, l);
        const t = document.createElement('div');
        const n = document.createElement('b'); n.textContent = c.name;
        const m = document.createElement('small');
        m.textContent = (c.categories || []).join(', ') || 'Geral';
        t.append(n, m); b.append(l, t);
        b.onclick = () => select(c);
        box.appendChild(b);
      }
    }

    function select(c) {
      S.current = c; S.idx = 0;
      $('name').textContent = c.name;
      $('meta').textContent = [c.network, (c.categories || []).join(', ')].filter(Boolean).join(' · ') || 'Brasil';
      logoEl(c, $('logo'));
      render(); play();
    }

    function renderSources() {
      const list = S.streams.get(S.current.id) || [];
      const box = $('sources'); box.textContent = '';
      if (list.length < 2) return;
      const lab = document.createElement('span'); lab.textContent = 'Fonte:'; box.appendChild(lab);
      list.forEach((s, i) => {
        const b = document.createElement('button');
        b.className = 'chip'; b.setAttribute('aria-pressed', i === S.idx);
        b.textContent = s.quality ? `${i + 1} · ${s.quality}` : `Fonte ${i + 1}`;
        b.onclick = () => { S.idx = i; play(); };
        box.appendChild(b);
      });
    }

    function play() {
      const list = S.streams.get(S.current.id) || [];
      const src = list[S.idx];
      renderSources();
      if (S.hls) { S.hls.destroy(); S.hls = null; }
      video.removeAttribute('src'); video.load();
      if (!src) { fail(); return; }

      overlay(); setStatus('load', 'Conectando…');
      const next = () => {
        if (S.idx + 1 < list.length) { S.idx++; play(); } else fail();
      };

      if (window.Hls && Hls.isSupported()) {
        const h = S.hls = new Hls({ lowLatencyMode: true });
        h.loadSource(src.url); h.attachMedia(video);
        h.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => { }));
        h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) next(); });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src.url;
        video.onerror = next;
        video.play().catch(() => { });
      } else { fail(); }
    }

    function fail() {
      setStatus('err', 'Sem sinal');
      overlay('Transmissão indisponível', 'Nenhuma fonte respondeu para este canal. Escolha outro na lista, tente outra fonte ou cole um link direto abaixo.', true);
    }

    function playDirect(url) {
      if (!url) return;
      S.current = { id: 'direct', name: 'Link direto', network: '', categories: ['Direto'] };
      S.streams.set('direct', [{ url, quality: 'Direto' }]);
      S.idx = 0;
      $('name').textContent = 'Link direto';
      $('meta').textContent = 'Stream inserida';
      $('logo').textContent = '▶';
      render(); play();
    }

    video.addEventListener('playing', () => { overlay(); setStatus('live', 'Ao vivo'); });
    video.addEventListener('waiting', () => setStatus('load', 'Carregando…'));

    $('search').addEventListener('input', e => { S.q = e.target.value; render(); });
    function tab(onlyGlobo) {
      S.onlyGlobo = onlyGlobo;
      $('tabGlobo').setAttribute('aria-pressed', onlyGlobo);
      $('tabAll').setAttribute('aria-pressed', !onlyGlobo);
      render();
    }
    $('tabGlobo').onclick = () => tab(true);
    $('tabAll').onclick = () => tab(false);
    $('ovRetry').onclick = load;

    // Link direto de stream
    $('btnDirect').onclick = () => {
      const url = $('directUrl').value.trim();
      if (!url) { $('directUrl').focus(); return; }
      if (!url.match(/\.(m3u8|mp4)(\?|$)/i)) {
        overlay('Link inválido', 'Insira um link terminando em .m3u8 ou .mp4.', true);
        return;
      }
      playDirect(url);
      overlay();
    };

    load();
  </script>
</body>

</html>
