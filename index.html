<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV ao vivo Â· Globo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">TV<span>.</span>ao vivo</div>
      <div class="live" id="status" data-s="load" role="status"><i class="dot"></i><span id="statusText">Carregando
          canaisâ€¦</span></div>
    </header>

    <main class="stage">
      <div class="screen">
        <video id="video" controls playsinline autoplay></video>
        <div class="overlay" id="overlay">
          <div><strong id="ovTitle"></strong>
            <p id="ovText"></p>
            <button id="ovRetry" style="display:none;margin-top:10px;padding:8px 14px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;cursor:pointer">Tentar novamente</button>
          </div>
        </div>
      </div>
      <div class="info">
        <div class="title">
          <div class="logo" id="logo">TV</div>
          <div>
            <h1 id="name">Globo</h1><small id="meta">Buscando transmissÃ£oâ€¦</small>
          </div>
        </div>
        <div class="sources" id="sources"></div>
      </div>
    </main>

    <aside>
      <div class="tools">
        <input id="search" type="search" placeholder="Buscar canal" aria-label="Buscar canal">
        <div class="direct">
          <input id="directUrl" type="text" placeholder="Cole um link .m3u8 ou .mp4" aria-label="Link direto da stream">
          <button id="btnDirect">Assistir</button>
        </div>
        <div class="tabs">
          <button class="chip" id="tabGlobo" aria-pressed="true">Globo</button>
          <button class="chip" id="tabAll" aria-pressed="false">Todos do Brasil</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>

</html>
